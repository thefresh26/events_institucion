<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Plataforma para organizar eventos escolares: los organizadores crean eventos y los colegios inscriben a sus estudiantes." />
		<meta property="og:title" content="Conexión Escolar" />
		<meta property="og:description" content="Organiza eventos y matricula colegios y estudiantes en un solo lugar." />
		<meta property="og:type" content="website" />
		<meta name="theme-color" content="#0d2540" />
		<link rel="icon" href="/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<link rel="preload" href="/fonts/body.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/display.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			try {
				var t = localStorage.getItem('tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.tema = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
